# Default terms and parts of terms for Course Schedulizer.
#
# This is the only place these are defined. Edit it, then run
#
#     pnpm run settings
#
# (the build, test and dev commands do this for you). That regenerates
# packages/core/src/settings.defaults.generated.ts, which the app uses for any schedule that does
# not bring its own Settings sheet. A schedule's own Settings sheet, when it has one, wins.

# The terms of an academic year, in the order they are listed and tabulated.
# `code` is what appears in the Term column of schedules.
terms:
  - code: FA
    name: Fall
  - code: WI
    name: Winter Intensive
    # A term that does not follow the semester grid lists its own parts here.
    # Every term needs a "Full" part (the default for a section with no part given).
    parts:
      - { code: Full, name: Winter intensive, weeks: [1, 2] }
  - code: SP
    name: Spring
  - code: SU
    name: Summer

# Parts of a term, used by every term that does not list its own `parts` above.
# `weeks` is the first and last week of the term the part covers, inclusive.
defaultParts:
  - { code: Full,   name: Full term,    weeks: [1, 16] }
  - { code: First,  name: First half,   weeks: [1, 8] }
  - { code: Second, name: Second half,  weeks: [9, 16] }
  - { code: A,      name: Intensive A,  weeks: [1, 4] }
  - { code: B,      name: Intensive B,  weeks: [5, 8] }
  - { code: C,      name: Intensive C,  weeks: [9, 12] }
  - { code: D,      name: Intensive D,  weeks: [13, 16] }

# Terms over which year-long (AY) non-teaching load is split evenly in the load tables.
spreadTerms: [FA, SP]

# Values of the Room column that are not rooms. They never conflict with each other.
nonRooms: [Off Campus, Online, TBD]

# The department's standard meeting patterns (from the old Course Schedulizer). A meeting is "standard" when its
# days, start time and length (in minutes) are all listed here; "Standard times" rules flag the others.
# Days use M T W R F (R = Thursday); start times are 24-hour.
standardTimes:
  - { days: MWF, duration: 65, starts: ["8:00", "9:15", "11:00", "12:15", "13:30", "14:45"] }
  - { days: MTR, duration: 65, starts: ["18:30", "19:45"] }
  - { days: TR, duration: 100, starts: ["8:00", "10:20", "12:15", "14:10", "18:30"] }
  - { days: MR, duration: 100, starts: ["18:30"] }
  - { days: M, duration: 210, starts: ["18:30"] }
  - { days: T, duration: 210, starts: ["18:30"] }
  - { days: R, duration: 210, starts: ["18:30"] }
  - { days: M, duration: 100, starts: ["18:30", "20:20"] }
  - { days: T, duration: 100, starts: ["18:30", "20:20"] }
  - { days: R, duration: 100, starts: ["18:30", "20:20"] }
  - { days: MW, duration: 50, starts: ["8:00", "9:15", "11:00", "12:15", "13:30", "14:45"] }
  - { days: TR, duration: 50, starts: ["8:00", "8:55", "10:20", "11:15", "12:15", "13:10", "14:10", "15:05", "18:30", "19:30", "20:30"] }
  - { days: MR, duration: 50, starts: ["18:30", "19:30", "20:30"] }
  - { days: MWF, duration: 120, starts: ["8:20", "11:00", "13:30", "18:30"] }
  - { days: MW, duration: 180, starts: ["8:00", "12:30", "18:30"] }
  - { days: TR, duration: 180, starts: ["8:00", "12:30", "18:30"] }
  - { days: M, duration: 170, starts: ["8:00", "11:15", "14:30", "18:30"] }
  - { days: T, duration: 170, starts: ["8:00", "11:15", "14:30", "18:30"] }
  - { days: W, duration: 170, starts: ["8:00", "11:15", "14:30", "18:30"] }
  - { days: R, duration: 170, starts: ["8:00", "11:15", "14:30", "18:30"] }
  - { days: F, duration: 170, starts: ["8:00", "11:15", "14:30"] }
  - { days: M, duration: 80, starts: ["8:00", "9:30", "11:00", "13:00", "14:30", "16:00"] }
  - { days: T, duration: 80, starts: ["8:00", "9:30", "11:00", "13:00", "14:30", "16:00"] }
  - { days: W, duration: 80, starts: ["8:00", "9:30", "11:00", "13:00", "14:30", "16:00"] }
  - { days: R, duration: 80, starts: ["8:00", "9:30", "11:00", "13:00", "14:30", "16:00"] }
  - { days: F, duration: 80, starts: ["8:00", "9:30", "11:00", "13:00", "14:30", "16:00"] }
  - { days: TWR, duration: 65, starts: ["16:00"] }
  - { days: MWF, duration: 60, starts: ["16:00"] }
  - { days: TWR, duration: 75, starts: ["17:15"] }
