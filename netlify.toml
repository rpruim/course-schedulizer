# Netlify: build the static site and publish it. No server, redirects or functions are needed
# (the app uses hash routes and relative asset paths).
[build]
  command = "pnpm build"
  publish = "apps/web/dist"

[build.environment]
  NODE_VERSION = "22"

# Built asset files have content-hashed names, so they can be cached for good.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"

# OneDrive sign-in: the app registration (made by Calvin IT) lists the redirect.html of each address the site is served
# from (course-schedulizer.netlify.app, schedulizer.pruim.co, dev--course-schedulizer.netlify.app, and
# http://localhost:5174 for local builds). The address is taken from the page, so the same build works on all of them.
# Production and branch deploys (the dev branch) get the ids; without them the OneDrive features stay hidden.
# These ids are not secrets.
[context.production.environment]
  VITE_MS_CLIENT_ID = "829e1c5d-a9be-4674-9d4f-3c8d35280b7c"
  VITE_MS_TENANT = "756349b9-0610-4b01-917b-2a4ac10df947"

[context.branch-deploy.environment]
  VITE_MS_CLIENT_ID = "829e1c5d-a9be-4674-9d4f-3c8d35280b7c"
  VITE_MS_TENANT = "756349b9-0610-4b01-917b-2a4ac10df947"
